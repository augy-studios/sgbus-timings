// The Android side of the Flutter app (android/README.md): the phone's app (app/, with
// Flutter's own Gradle plugin) and the Wear OS watch's (wear/, plain Android).
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null, "flutter.sdk not set in local.properties: run `flutter pub get` in android/ first"
        return path
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
// The Wear OS app: built with the phone's, by android/build-apk.ps1 (wear/build.gradle).
include ":wear"
