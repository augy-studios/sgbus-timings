<!doctype html>
<!--
  The desktop app's live map page: MapLibre GL JS 5.24.0 (maplibre-gl.js and .css beside this
  file, bundled with the app so it works offline) and map.js, which carries out the commands the
  app's Dart side sends and posts the map's events back to it. It's loaded in a WebView from the
  app's own local server (lib/features/map/web/map_server.dart), never from the internet; the
  map's styles and tiles come through that server too, from its cache or from OpenFreeMap.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Only this page's own files and the app's local server, which the map's styles and tiles
       come through: MapLibre's worker runs from a blob, and its images are decoded from blobs.
       Nothing from anywhere else can load or be fetched, even if a style named it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; worker-src blob:; child-src blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SG Bus Timings map</title>
  <link rel="stylesheet" href="maplibre-gl.css">
  <style>
    /* The ground before the style draws: the app's theme sends it (map.js, setGround). */
    :root { --ground: #f2efe9; }
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
    /* A map, not a page: nothing to select, drag out or bounce. */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    /* The compass (top right, placed by map.js as Android's is) shows only while the map is turned
       or tilted, as MapLibre's on Android. */
    #map.sg-north .maplibregl-ctrl-top-right { display: none; }
    .maplibregl-ctrl-top-right .maplibregl-ctrl { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="maplibre-gl.js"></script>
  <script src="map.js"></script>
</body>
</html>
