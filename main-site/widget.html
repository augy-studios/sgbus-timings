<!doctype html>
<!-- The Bus timings widget for the Windows and Linux app (desktop/): the next buses at a stop
     you pick, in a small window of its own on the desktop, resizable any way. The same widget
     as the Windows 11 one (sw.js, widgets/timings.json) and the Android one
     (TimingsWidget.java), as a page of its own so it's light: none of the app's other scripts.
     The desktop app opens it as /widget.html?id=<widget>, and keeps each one's stop through
     window.sgbusDesktop.widget. It's the site's own origin, so it reads your favourite stops
     from the same storage as the app. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus timings</title>
  <script>
    // The app's light or dark, as the page has it (js/theme.js), before first paint.
    (function () {
      var m = localStorage.getItem('sgbus.mode') || 'light';
      if (m === 'time') { var h = new Date().getHours(); m = h >= 9 && h < 18 ? 'light' : 'dark'; }
      document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <style>
    :root { --bg: #f2f7f3; --row: #e2f5e5; --ink: #121815; --muted: #5b665f; --accent: #1f6b3d; --border: rgba(18, 24, 21, 0.12); }
    :root[data-mode="dark"] { --bg: #151b18; --row: #1f2924; --ink: #eef2ef; --muted: #9aa7a0; --accent: #bff5cf; --border: rgba(255, 255, 255, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink);
      font: 14px/1.35 "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none;
    }
    /* The top bar drags the window; its buttons don't. */
    header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 14px; -webkit-app-region: drag; }
    header .text { flex: 1; min-width: 0; }
    h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header button {
      -webkit-app-region: no-drag; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: var(--row); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
    }
    header button:hover { filter: brightness(0.95); }
    header button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    header svg { width: 15px; height: 15px; }
    main { flex: 1; overflow-y: auto; padding: 0 10px; scrollbar-width: thin; }
    .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px; border-radius: 12px; background: var(--row); cursor: pointer; }
    .row .no { width: 52px; font-weight: 700; font-size: 16px; }
    .row span { flex: 1; font-size: 13px; }
    .row span:nth-child(2) { color: var(--accent); font-weight: 700; font-size: 14px; }
    .row span:nth-child(4) { color: var(--muted); }
    .note { padding: 20px 10px; text-align: center; color: var(--muted); }
    footer { padding: 6px 14px 10px; font-size: 11px; color: var(--muted); text-align: right; }
    form { display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 12px; }
    form p { color: var(--muted); font-size: 12px; }
    .favs { display: flex; flex-direction: column; gap: 4px; }
    .favs button { text-align: left; border: 1px solid var(--border); background: var(--row); color: var(--ink); border-radius: 10px; padding: 7px 10px; font: inherit; cursor: pointer; }
    .favs button.on { outline: 2px solid var(--accent); }
    input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); }
    .save { font: inherit; font-weight: 700; padding: 8px; border: 0; border-radius: 10px; background: var(--accent); color: var(--bg); cursor: pointer; }
    .error { color: #b91c1c; }
    :root[data-mode="dark"] .error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <div class="text"><h1 id="title">Bus timings</h1><div class="sub" id="subtitle"></div></div>
    <button type="button" id="refresh" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></button>
    <button type="button" id="edit" title="Pick another stop" aria-label="Pick another stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
    <button type="button" id="pin" title="Keep on top" aria-label="Keep on top" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M8 3h8l-1 6 3 4H6l3-4-1-6z"/></svg></button>
    <button type="button" id="close" title="Remove this widget" aria-label="Remove this widget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <main id="body"></main>
  <footer id="updated"></footer>
  <script src="/js/widget.js"></script>
</body>
</html>
