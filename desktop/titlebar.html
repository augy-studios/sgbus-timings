<!doctype html>
<!-- The app window's own title bar (main.js, createWindow): back, forward, reload, the page's
     address, and screenshot and long screenshot buttons, with the site in a view of its own below it. The address
     can be typed over (Ctrl+L or F6 from the site), and its button copies the link. The window's controls: on macOS the system's
     traffic lights, drawn over the bar's left; on Windows and Linux the bar's own minimise,
     maximise and close, on its right. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>SG Bus Timings</title>
  <style>
    :root { --bg: #ccffcc; --fg: #0c100e; --field: rgba(0, 0, 0, .08); --hover: rgba(0, 0, 0, .1);
      --select: rgba(0, 0, 0, .2); }
    :root.dark { --fg: #f2fff2; --field: rgba(255, 255, 255, .14); --hover: rgba(255, 255, 255, .16);
      --select: rgba(255, 255, 255, .3); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; }
    .bar { box-sizing: border-box; height: 40px; display: flex; align-items: center; gap: 2px;
      padding: 0 0 0 8px; -webkit-app-region: drag; }
    .mac .bar { padding: 0 8px 0 78px; }
    .mac.fullscreen .bar { padding-left: 8px; }
    button { -webkit-app-region: no-drag; appearance: none; border: 0; background: none; color: inherit;
      font: inherit; cursor: default; border-radius: 6px; }
    .nav { flex: none; width: 30px; height: 28px; display: grid; place-items: center; }
    #shot { margin-left: 4px; }
    .shooting #shot, .shooting #longshot { opacity: .35; }
    .nav:hover:not(:disabled) { background: var(--hover); }
    .nav:disabled { opacity: .35; }
    .nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; }
    .loading #reload svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #address { flex: 1; min-width: 0; height: 28px; margin: 0 0 0 6px; padding: 0 3px 0 10px; display: flex;
      align-items: center; gap: 6px; background: var(--field); border-radius: 14px;
      -webkit-app-region: no-drag; }
    #address:hover { background: var(--hover); }
    #address:focus-within { background: var(--field); box-shadow: inset 0 0 0 2px currentColor; }
    #address svg { flex: none; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
    #url { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: none;
      color: inherit; font: inherit; text-overflow: ellipsis; user-select: text; cursor: text; }
    #url::selection { background: var(--select); color: var(--fg); }
    #copy { flex: none; width: 24px; height: 22px; display: grid; place-items: center; border-radius: 11px; }
    #copy:hover { background: var(--hover); }
    #copied { display: none; flex: none; font-weight: 600; padding-right: 7px; }
    .copied #copy { display: none; }
    /* Minimise, maximise and close, the full height of the bar at its right, as Windows has them.
       Not on macOS, which has its traffic lights, nor full screen. */
    .controls { flex: none; display: flex; height: 100%; margin-left: 8px; }
    .mac .controls, .fullscreen .controls { display: none; }
    .fullscreen .bar { padding-right: 8px; }
    .control { width: 46px; height: 100%; display: grid; place-items: center; border-radius: 0; }
    .control:hover { background: var(--hover); }
    .control:active { background: var(--field); }
    #close:hover { background: #c42b1c; color: #fff; }
    #close:active { background: #b22a1c; color: #fff; }
    .control svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1;
      shape-rendering: crispEdges; }
    #close svg { shape-rendering: auto; }
    #restore-icon, .maximized #max-icon { display: none; }
    .maximized #restore-icon { display: block; }
    .copied #url { opacity: .45; }
    .copied #copied { display: inline; }
  </style>
</head>
<body>
  <div class="bar">
    <button class="nav" id="back" title="Back (Alt+Left)" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav" id="forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav" id="reload" title="Reload (F5)" aria-label="Reload">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
    <form id="address">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Address"
        title="Type an address and press Enter (Ctrl+L)">
      <span id="copied"></span>
      <button type="button" id="copy" title="Copy the link" aria-label="Copy the link">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </form>
    <button class="nav" id="shot" title="Screenshot: copies it, and saves it in Downloads" aria-label="Screenshot">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button class="nav" id="longshot" title="Long screenshot: the whole page, top to bottom; copies it, and saves it in Downloads" aria-label="Long screenshot">
      <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v9M9 13l3 3 3-3"/></svg>
    </button>
    <div class="controls">
      <button class="control" id="minimize" title="Minimise" aria-label="Minimise">
        <svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg>
      </button>
      <button class="control" id="maximize" title="Maximise" aria-label="Maximise">
        <svg id="max-icon" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg>
        <svg id="restore-icon" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg>
      </button>
      <button class="control" id="close" title="Close (keeps running in the tray)" aria-label="Close">
        <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg>
      </button>
    </div>
  </div>
  <script src="titlebar.js"></script>
</body>
</html>
