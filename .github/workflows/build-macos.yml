# Builds the macOS app (desktop/) on GitHub's Macs, as no one here has a Mac to build it on.
#
# - Pushed changes to desktop/ (or this file): builds it, and the .dmg and .zip are kept on the
#   run, under Artifacts, for 30 days.
# - Run by hand (Actions > Build macOS app > Run workflow): the same, and with a release's tag,
#   such as android-v2.0.2, the files are also added to that GitHub release.
# - A release published: built from its tag and added to it, beside the other installers.
#
# The app is ad-hoc signed, not signed with an Apple Developer ID, so macOS says it "can't be
# opened" the first time (desktop/README.md, "macOS").
name: Build macOS app

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "A release's tag to add the files to, such as android-v2.0.2. Empty: only keep them on the run."
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      # No Apple certificate: don't look for one in the keychain (package.json signs ad-hoc).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds from its own tag; a push or a hand run from the branch it's on.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build the .dmg and .zip, for Apple silicon and Intel
        run: npm run build:mac

      - name: List what was built
        id: files
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml

      - uses: actions/upload-artifact@v4
        with:
          name: sg-bus-timings-${{ steps.files.outputs.version }}-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      # latest-mac.yml is what the app reads to hear of a new version (updater.js).
      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" --clobber
