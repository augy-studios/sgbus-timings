# Builds the desktop app (desktop/) for macOS, Windows and Linux on GitHub's own machines, each
# on its own system: a Mac app can only be built on a Mac, and the .msi only on Windows.
#
# - Pushed changes to desktop/ (or this file): builds them all, and the installers are kept on
#   the run, under Artifacts, for 30 days.
# - Run by hand (Actions > Build desktop apps > Run workflow): the same, and with a release's tag,
#   such as android-v2.0.3, the installers are also added to that GitHub release, replacing any
#   of the same name. With no release of that tag yet, a draft one is made for them: add the
#   APK to it and publish it. Until then nobody's app sees it, as a draft is never the latest.
# - A release published: built from its tag and added to it, beside the APK; unless it has
#   them all already (a draft made by a hand run, say).
#
# None of them is signed with a paid certificate: the Mac app is signed ad-hoc, so macOS says it
# "can't be opened" the first time, and Windows SmartScreen warns before the first run
# (desktop/README.md).
#
# The command-line edition for Linux (cli/, from 2.2.2) is built and checked with dpkg-deb on
# every run, and goes on the release with them: its single file `sgbus` and its .deb.
#
# Windows' .exe is one installer for both x64 and Arm (it installs whichever the PC is); the
# .msi is x64 only, as electron-builder's WiX can't make an Arm one. Linux's .deb, .rpm and
# .AppImage are each built for x64 and arm64, the Arm ones cross-built on the same x64 machine.
#
# With the APT_SIGNING_KEY secret set (desktop/LINUX-BUILD.md, "An apt repository"), the newest
# published release's .deb files also go into a signed apt repository on GitHub Pages, so
# `apt upgrade` brings each new version. Without the secret that job is skipped.
name: Build desktop apps

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "A release's tag to add the installers to, such as android-v2.0.3 (a draft release is made if there's none). Empty: only keep them on the run."
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

jobs:
  # Where the installers go, and whether they need building at all.
  release:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      cli: ${{ steps.check.outputs.cli }}
      apt: ${{ steps.check.outputs.apt }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - id: check
        env:
          # Only whether it's set: a job's `if` can't read secrets.
          APT_KEY_SET: ${{ secrets.APT_SIGNING_KEY != '' }}
        run: |
          # The apt repository, for a release, once its signing key is a secret.
          if [ -n "$RELEASE_TAG" ] && [ "$APT_KEY_SET" = true ]; then
            echo "apt=true" >> "$GITHUB_OUTPUT"
          else
            echo "apt=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # The command line too, a minute's build checked with dpkg-deb, so a push tests it.
            echo "cli=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            # Published with every platform's update file on it already: nothing to build.
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            missing=false
            for f in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
              grep -qx "$f" <<< "$assets" || missing=true
            done
            echo "build=$missing" >> "$GITHUB_OUTPUT"
            echo "cli=$(grep -qx sgbus <<< "$assets" && echo false || echo true)" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              version="${RELEASE_TAG#android-v}"
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
                --title "SG Bus Timings $version" \
                --notes "The desktop installers for $version, built by GitHub Actions. Add the APK, write what's new, then publish."
            fi
          fi

  build:
    needs: release
    if: needs.release.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            build: npm run build:mac
            # latest-mac.yml and the .zip are what the Mac app reads to update itself (updater.js).
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: windows-latest
            name: windows
            build: npm run build:win
            # latest.yml and the .exe's blockmap: the .exe's own updates. The .exe carries the
            # app for x64 and for Arm, so one file, under its old name, updates both.
            files: |
              dist/*-setup.exe
              dist/*.msi
              dist/*.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            name: linux
            build: npm run build:linux
            # latest-linux.yml and latest-linux-arm64.yml: the AppImages' updates, x64 and Arm.
            # Cross-built here rather than on an Arm runner: the app has no native modules, so
            # packaging it for Arm runs nothing on Arm, and one job writes both .yml files.
            files: |
              dist/*.deb
              dist/*.rpm
              dist/*.AppImage
              dist/latest-linux.yml
              dist/latest-linux-arm64.yml
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      # No paid certificate: don't look for one (package.json signs the Mac app ad-hoc).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds from its own tag; a push or a hand run from the branch it's on.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # The .rpm needs rpmbuild, which electron-builder's fpm calls.
      - name: Install rpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build
        run: ${{ matrix.build }}

      - name: List what was built
        id: files
        env:
          FILES: ${{ matrix.files }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The files, one per line, for the release upload; and with desktop/ before each for
          # upload-artifact, which doesn't follow working-directory.
          {
            echo 'list<<EOF'
            echo "$FILES" | sed '/^$/d; s|^|desktop/|'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          ls -lh $FILES

      - uses: actions/upload-artifact@v4
        with:
          name: sg-bus-timings-${{ steps.files.outputs.version }}-${{ matrix.name }}
          path: ${{ steps.files.outputs.list }}
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          gh release upload "$RELEASE_TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber

  # The command-line edition (cli/README.md): built with plain Node, then checked by Debian's own
  # tools and run once before it goes anywhere.
  cli:
    needs: release
    if: needs.release.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node cli/build.mjs

      - name: Check it
        run: |
          deb="$(ls cli/dist/sg-bus-timings-cli-*-all.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          sgbus --version
          sgbus 84009 > timings.txt
          head -5 timings.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sg-bus-timings-cli
          path: |
            cli/dist/sgbus
            cli/dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" cli/dist/sgbus cli/dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  # The apt repository (desktop/LINUX-BUILD.md, "An apt repository"): the newest published
  # release's .deb files, the app's for amd64 and arm64 and the command line's for all, signed
  # with APT_SIGNING_KEY and put on GitHub Pages, at https://augy-studios.github.io/sgbus-timings/.
  # It holds only the newest version, as releases/latest does. It runs once the other jobs have
  # finished or were skipped (a release that had its files already), and reads the .deb files
  # from the release itself; a draft, or a release that isn't the newest, is left out.
  apt:
    needs: [release, build, cli]
    if: >-
      !cancelled() && needs.release.outputs.apt == 'true'
      && needs.build.result != 'failure' && needs.cli.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Is it the newest published release?
        id: newest
        run: |
          # gh release view with no tag: the latest release, never a draft or a pre-release.
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)"
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG isn't the newest published release ($latest), so the apt repository is left as it is."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the .deb files
        if: steps.newest.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          ls -lh debs

      - name: Build the repository
        if: steps.newest.outputs.go == 'true'
        run: |
          mkdir -p repo/pool/main
          # Named as Debian names them, package_version_architecture.deb, which is how
          # dpkg-scanpackages --arch picks each architecture's (and the _all ones) for its list.
          for deb in debs/*.deb; do
            name="$(dpkg-deb -f "$deb" Package)_$(dpkg-deb -f "$deb" Version)_$(dpkg-deb -f "$deb" Architecture).deb"
            cp "$deb" "repo/pool/main/$name"
          done
          cd repo
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            dpkg-scanpackages --arch "$arch" pool/ > "dists/stable/main/binary-$arch/Packages"
            gzip -9nk "dists/stable/main/binary-$arch/Packages"
            echo "$arch:"; grep -E '^(Package|Version|Architecture):' "dists/stable/main/binary-$arch/Packages"
          done
          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="SG Bus Timings" \
            -o APT::FTPArchive::Release::Label="SG Bus Timings" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="SG Bus Timings for Linux, and sgbus, its command line" \
            release . > ../Release.new
          mv ../Release.new Release

      - name: Sign it
        if: steps.newest.outputs.go == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          cd repo/dists/stable
          gpg --batch --yes --local-user "$key" --clearsign --output InRelease Release
          gpg --batch --yes --local-user "$key" --armor --detach-sign --output Release.gpg Release
          cd ../..
          # The public key, for the install lines: binary for signed-by, and as text to read.
          gpg --batch --export "$key" > sgbus-timings.gpg
          gpg --batch --armor --export "$key" > sgbus-timings.asc
          rm -rf "$GNUPGHOME"

      # apt itself reads it as a user's computer would, before it goes anywhere.
      - name: Check it with apt
        if: steps.newest.outputs.go == 'true'
        run: |
          sudo install -D -m 644 repo/sgbus-timings.gpg /etc/apt/keyrings/sgbus-timings-check.gpg
          echo "deb [signed-by=/etc/apt/keyrings/sgbus-timings-check.gpg] file:$PWD/repo stable main" \
            | sudo tee /etc/apt/sources.list.d/sgbus-timings-check.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/sgbus-timings-check.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          apt-cache policy sgbus-timings-desktop sgbus-timings-cli
          apt-cache show sgbus-timings-desktop sgbus-timings-cli > /dev/null
          sudo rm /etc/apt/sources.list.d/sgbus-timings-check.list /etc/apt/keyrings/sgbus-timings-check.gpg

      - uses: actions/upload-pages-artifact@v3
        if: steps.newest.outputs.go == 'true'
        with:
          path: repo

      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.newest.outputs.go == 'true'
