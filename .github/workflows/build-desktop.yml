# Builds the desktop app (the Flutter project in flutter/) for Windows, macOS and Linux on GitHub's
# own machines, each on its own system and processor: Flutter can't build a Mac app anywhere but a
# Mac, nor cross-build Windows or Linux for another processor. The packaging is done by the
# scripts in flutter/installers/, which say what each file is and why it's named as it is.
#
# - A release published: built from its tag and added straight to it, beside the APK; unless it
#   has them all already (a draft made by a hand run, say). A push builds nothing: publishing's
#   own tag would otherwise build everything a second time, for nowhere.
# - Run by hand (Actions > Build desktop apps > Run workflow): with a release's tag, such as
#   android-v2.5.0, the installers are added to that GitHub release, replacing any of the same
#   name. With no release of that tag yet, a draft one is made for them: add the APK to it and
#   publish it. Until then nobody's app sees it, as a draft is never the latest. With the tag left
#   empty, they're kept on the run, under Artifacts, for 30 days, to try a build.
#
# What's built, under the Electron app's file names so its updater installs this one:
#   Windows  sg-bus-timings-<v>-setup.exe (x64 and Arm64 in one), sg-bus-timings-<v>.msi (x64),
#            latest.yml. The x64 and Arm64 halves are built on an x64 and an Arm machine, then one
#            job packs both into the .exe and builds the .msi.
#   macOS    sg-bus-timings-<v>-mac-arm64.zip/.dmg and -mac-x64.zip/.dmg, latest-mac.yml
#   Linux    .deb, .rpm and .AppImage for x64 and arm64, latest-linux.yml, latest-linux-arm64.yml
#
# The tests run first (on Linux, whose fonts the screenshot tests are drawn with); nothing is
# built from code that fails them.
#
# None of them is signed with a paid certificate: the Mac app is signed ad hoc, so macOS says it
# "can't be opened" the first time, and Windows SmartScreen warns before the first run.
#
# The command-line edition for Linux (cli/, from 2.2.2) is built and checked with dpkg-deb on
# every run, and goes on the release with them: its single file `sgbus` and its .deb.
#
# With the APT_SIGNING_KEY secret set (flutter/installers/linux/LINUX-BUILD.md, "An apt repository"), the newest
# published release's .deb files also go into a signed apt repository on GitHub Pages, so
# `apt upgrade` brings each new version. Without the secret that job is skipped.
name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "A release's tag to add the installers to, such as android-v2.5.0 (a draft release is made if there's none). Empty: only keep them on the run."
        required: false
        default: ''
  release:
    types: [published]

# Nothing by default: each job asks for only what it needs.
permissions: {}

concurrency:
  group: build-desktop-${{ github.ref }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: true

env:
  # Augy's Flutter version (flutter/.metadata's revision, c197ca5). Not newer: Flutter 3.50's
  # Dart (3.14) can't compile nativeapi 0.5.10, which is written for Dart 3.13.
  FLUTTER_VERSION: 3.47.9
  # The release to add the files to; empty for a hand run that only keeps them on the run.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  # Where the installers go, and whether they need building at all.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to make a draft release for a hand run's tag
    outputs:
      build: ${{ steps.check.outputs.build }}
      cli: ${{ steps.check.outputs.cli }}
      apt: ${{ steps.check.outputs.apt }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        env:
          # Only whether it's set: a job's `if` can't read secrets.
          APT_KEY_SET: ${{ secrets.APT_SIGNING_KEY != '' }}
        run: |
          # The apt repository, for a release, once its signing key is a secret.
          if [ -n "$RELEASE_TAG" ] && [ "$APT_KEY_SET" = true ]; then
            echo "apt=true" >> "$GITHUB_OUTPUT"
          else
            echo "apt=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # The command line too, a minute's build checked with dpkg-deb, so a try tests it.
            echo "cli=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            # Published with every platform's update file on it already: nothing to build.
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            missing=false
            for f in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
              grep -qx "$f" <<< "$assets" || missing=true
            done
            echo "build=$missing" >> "$GITHUB_OUTPUT"
            echo "cli=$(grep -qx sgbus <<< "$assets" && echo false || echo true)" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              version="${RELEASE_TAG#android-v}"
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
                --title "SG Bus Timings $version" \
                --notes "The desktop installers for $version, built by GitHub Actions. Add the APK, write what's new, then publish."
            fi
          fi

  # The Flutter tests, once, before anything's built. On Linux: the screenshot tests are drawn
  # with its fonts (DejaVu).
  test:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          # A release builds from its own tag; a hand run from the branch it's on.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Flutter
        working-directory: .
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # flutter test builds every package's native code for this machine first: cnativeapi (under
      # window_manager and tray_manager) needs GTK 3, X11 and Xi through pkg-config, so the same
      # packages as desktop-check.yml's Linux job. Without them the tests, and so every installer
      # after them, never run.
      - name: Install build packages and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config fonts-dejavu-core \
            libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxi-dev libpulse-dev

      - run: flutter pub get
      - run: flutter test

  # Windows, one half per processor, each on its own machine. The halves go to the next job.
  windows:
    needs: [release, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: flutter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Flutter from its own repository at the version's tag: on the Arm machine it then fetches
      # its Arm64 tools for itself.
      - name: Install Flutter
        working-directory: .
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build windows --release

      # The build with its program renamed "SG Bus Timings.exe", in build\installers\windows\<arch>.
      - name: Stage it
        run: ./installers/windows/stage-windows.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: flutter/build/installers/windows/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Both Windows halves into the .exe, and the x64 one into the .msi, then latest.yml.
  windows-installers:
    needs: [release, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # to add the files to the release
    defaults:
      run:
        working-directory: flutter
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: flutter/build/installers/windows/x64
      - uses: actions/download-artifact@v4
        with:
          name: windows-arm64
          path: flutter/build/installers/windows/arm64

      # NSIS for the .exe; the WiX Toolset for the .msi, at 5.0.2, the version sgbus-timings.wxs
      # is written for.
      - name: Install NSIS and WiX
        run: |
          # upgrade installs it, or brings an older copy on the machine up to date (the shortcuts
          # need Include\Win\COM.nsh, which only recent versions have).
          choco upgrade nsis -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build the installers
        run: ./installers/windows/package-windows.ps1

      - name: Write latest.yml
        run: node installers/update-files.mjs windows

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: sg-bus-timings-windows
          path: |
            flutter/build/dist/*-setup.exe
            flutter/build/dist/*.msi
            flutter/build/dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/dist/*-setup.exe build/dist/*.msi build/dist/latest.yml --repo "$GITHUB_REPOSITORY" --clobber

  # Both Mac processors, one after the other on the same Mac, then latest-mac.yml.
  mac:
    needs: [release, test]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # to add the files to the release
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Flutter
        working-directory: .
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter --version
      - run: flutter pub get

      # FLUTTER_XCODE_ARCHS goes to Xcode as ARCHS: one processor per build.
      - name: Build for Apple silicon
        run: FLUTTER_XCODE_ARCHS=arm64 flutter build macos --release
      - name: Pack it
        run: bash installers/macos/package-macos.sh arm64

      - name: Build for Intel
        run: FLUTTER_XCODE_ARCHS=x86_64 flutter build macos --release
      - name: Pack it
        run: bash installers/macos/package-macos.sh x64

      - name: Write latest-mac.yml
        run: node installers/update-files.mjs mac

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: sg-bus-timings-mac
          path: |
            flutter/build/dist/*.zip
            flutter/build/dist/*.dmg
            flutter/build/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/dist/*.zip build/dist/*.dmg build/dist/latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber

  # Linux, each processor on its own machine: .deb, .rpm, AppImage and the update file.
  linux:
    needs: [release, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
            yml: latest-linux.yml
            appimagetool: appimagetool-x86_64.AppImage
          - arch: arm64
            os: ubuntu-24.04-arm
            yml: latest-linux-arm64.yml
            appimagetool: appimagetool-aarch64.AppImage
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # to add the files to the release
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Flutter's Linux build tools, the libraries the app and its plugins build against (GTK 3,
      # WebKitGTK 4.1 for the map, X11 and Xi for nativeapi, PulseAudio for flutter_webrtc), and
      # rpmbuild for the .rpm.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config file rpm \
            libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxi-dev libpulse-dev

      - name: Install Flutter
        working-directory: .
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # appimagetool 1.9.1, for this processor.
      - name: Install appimagetool
        working-directory: .
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/${{ matrix.appimagetool }}"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Pack it
        run: bash installers/linux/package-linux.sh ${{ matrix.arch }}

      - name: Write ${{ matrix.yml }}
        run: node installers/update-files.mjs linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: sg-bus-timings-linux-${{ matrix.arch }}
          path: |
            flutter/build/dist/*.deb
            flutter/build/dist/*.rpm
            flutter/build/dist/*.AppImage
            flutter/build/dist/${{ matrix.yml }}
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" build/dist/*.deb build/dist/*.rpm build/dist/*.AppImage \
            "build/dist/${{ matrix.yml }}" --repo "$GITHUB_REPOSITORY" --clobber

  # The command-line edition (cli/README.md): built with plain Node, then checked by Debian's own
  # tools and run once before it goes anywhere.
  cli:
    needs: release
    if: needs.release.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to add the files to the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node cli/build.mjs

      - name: Check it
        run: |
          deb="$(ls cli/dist/sg-bus-timings-cli-*-all.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y "./$deb"
          sgbus --version
          sgbus 84009 > timings.txt
          head -5 timings.txt

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: sg-bus-timings-cli
          path: |
            cli/dist/sgbus
            cli/dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Add them to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" cli/dist/sgbus cli/dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  # The apt repository (flutter/installers/linux/LINUX-BUILD.md, "An apt repository"): the newest published
  # release's .deb files, the app's for amd64 and arm64 and the command line's for all, signed
  # with APT_SIGNING_KEY and put on GitHub Pages, at https://augy-studios.github.io/sgbus-timings/.
  # It holds only the newest version, as releases/latest does. It runs once the Linux and command
  # line jobs have finished or were skipped (a release that had its files already), and reads the
  # .deb files from the release itself; a draft, or a release that isn't the newest, is left out.
  # Not after failed tests, which build nothing: the release would have no app .deb to read.
  apt:
    needs: [release, test, linux, cli]
    if: >-
      !cancelled() && needs.release.outputs.apt == 'true'
      && needs.test.result != 'failure' && needs.linux.result != 'failure' && needs.cli.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Is it the newest published release?
        id: newest
        run: |
          # gh release view with no tag: the latest release, never a draft or a pre-release.
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)"
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG isn't the newest published release ($latest), so the apt repository is left as it is."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the .deb files
        if: steps.newest.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          ls -lh debs

      - name: Build the repository
        if: steps.newest.outputs.go == 'true'
        run: |
          mkdir -p repo/pool/main
          # Named as Debian names them, package_version_architecture.deb, which is how
          # dpkg-scanpackages --arch picks each architecture's (and the _all ones) for its list.
          for deb in debs/*.deb; do
            name="$(dpkg-deb -f "$deb" Package)_$(dpkg-deb -f "$deb" Version)_$(dpkg-deb -f "$deb" Architecture).deb"
            cp "$deb" "repo/pool/main/$name"
          done
          cd repo
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            dpkg-scanpackages --arch "$arch" pool/ > "dists/stable/main/binary-$arch/Packages"
            gzip -9nk "dists/stable/main/binary-$arch/Packages"
            echo "$arch:"; grep -E '^(Package|Version|Architecture):' "dists/stable/main/binary-$arch/Packages"
          done
          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="SG Bus Timings" \
            -o APT::FTPArchive::Release::Label="SG Bus Timings" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="SG Bus Timings for Linux, and sgbus, its command line" \
            release . > ../Release.new
          mv ../Release.new Release

      - name: Sign it
        if: steps.newest.outputs.go == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          cd repo/dists/stable
          gpg --batch --yes --local-user "$key" --clearsign --output InRelease Release
          gpg --batch --yes --local-user "$key" --armor --detach-sign --output Release.gpg Release
          cd ../..
          # The public key, for the install lines: binary for signed-by, and as text to read.
          gpg --batch --export "$key" > sgbus-timings.gpg
          gpg --batch --armor --export "$key" > sgbus-timings.asc
          rm -rf "$GNUPGHOME"

      # apt itself reads it as a user's computer would, before it goes anywhere.
      - name: Check it with apt
        if: steps.newest.outputs.go == 'true'
        run: |
          sudo install -D -m 644 repo/sgbus-timings.gpg /etc/apt/keyrings/sgbus-timings-check.gpg
          echo "deb [signed-by=/etc/apt/keyrings/sgbus-timings-check.gpg] file:$PWD/repo stable main" \
            | sudo tee /etc/apt/sources.list.d/sgbus-timings-check.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/sgbus-timings-check.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          apt-cache policy sgbus-timings-desktop sgbus-timings-cli
          apt-cache show sgbus-timings-desktop sgbus-timings-cli > /dev/null
          sudo rm /etc/apt/sources.list.d/sgbus-timings-check.list /etc/apt/keyrings/sgbus-timings-check.gpg

      - uses: actions/upload-pages-artifact@v3
        if: steps.newest.outputs.go == 'true'
        with:
          path: repo

      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.newest.outputs.go == 'true'
